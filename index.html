<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--card:#fff;--tx:#1a1c20;--mu:#6b7280;--bd:#d9dce1;--pr:#1f2937;--prt:#fff;--ac:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1f2226;--tx:#eceef1;--mu:#9aa1ab;--bd:#343841;--pr:#e5e7eb;--prt:#111;--ac:#6b9bff}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2226;--tx:#eceef1;--mu:#9aa1ab;--bd:#343841;--pr:#e5e7eb;--prt:#111;--ac:#6b9bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Prompt',system-ui,sans-serif;font-size:15px}
main{max-width:880px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
textarea,input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
textarea{min-height:130px;resize:vertical}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.prev{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.prev .stage{background:#fff;border:1px solid var(--bd);box-shadow:0 2px 10px #0002;max-width:100%;overflow:auto}
.prev .f{flex:1;min-width:240px}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.item:first-of-type{border-top:0}
.item input[type=checkbox]{width:20px;height:20px;flex:none}
.item .t{flex:1;min-width:0}.item .t b{display:block}.item .t span{color:var(--mu);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item button{padding:5px 10px;font-size:13px}
.mu{color:var(--mu);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--pr);color:var(--prt);padding:9px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
details summary{cursor:pointer;font-weight:600}
/* ===== ใบปะหน้า A6 แนวนอน 148x105 mm ===== */
.lbl{width:148mm;height:105mm;background:#fff;color:#000;font-family:'Prompt',sans-serif;position:relative;overflow:hidden;padding:7mm 8mm 7mm;display:flex;flex-direction:column}
.lbl .hd{height:22mm;flex:none;display:flex;align-items:center;border-bottom:.6mm solid #000;padding-bottom:2.5mm}
.lbl .hd img{height:19mm;width:auto;display:block}
.lbl .bd{flex:1;min-height:0;display:flex}
.lbl .sd{width:48mm;flex:none;padding:3.5mm 4mm 0 0;border-right:.3mm dashed #000}
.lbl .k{display:flex;align-items:center;gap:1.8mm;font-size:3mm;letter-spacing:.4mm;font-weight:600;margin-bottom:1.2mm}
.lbl .k b{background:#000;color:#fff;border-radius:1.1mm;padding:.3mm 2.2mm;font-size:3.8mm;letter-spacing:0;font-weight:600}
.lbl .sd .n{font-weight:600;font-size:4.2mm;line-height:1.3}
.lbl .sd .a{font-size:3.4mm;font-weight:300;line-height:1.45;margin-top:.8mm}
.lbl .sd .t{font-size:3.6mm;margin-top:1mm;display:flex;align-items:center;gap:1.4mm}
.lbl .rc{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;padding:3.5mm 0 0 5mm}
.lbl .rc .k b{font-size:4.6mm;padding:.4mm 3mm}
.lbl .rc .n{font-weight:600;line-height:1.25}
.lbl .rc .t{font-size:5.6mm;font-weight:600;margin:1.6mm 0;display:flex;align-items:center;gap:2mm;letter-spacing:.2mm}
.lbl svg{width:4.8mm;height:4.8mm;flex:none}.lbl .sd svg{width:3.4mm;height:3.4mm}
.lbl .rc .a{font-weight:400;line-height:1.4;flex:1 1 0;min-height:0;overflow:hidden}
.lbl .zp{align-self:flex-end;flex:none;display:flex;align-items:center;gap:2.5mm;margin-top:1.5mm;max-width:100%}
.lbl .zp span{font-size:3.2mm;font-weight:600}
.lbl .zp b{border:.6mm solid #000;border-radius:1.4mm;font-size:7mm;font-weight:600;letter-spacing:.7mm;padding:.2mm 2mm .2mm 2.6mm;line-height:1.3;white-space:nowrap}
.lbl .no{position:absolute;top:7mm;right:8mm;text-align:right;font-size:4mm;font-weight:600;line-height:1.25;letter-spacing:.2mm}.lbl .no small{display:block;font-size:3mm;font-weight:300;letter-spacing:0}
.hid{position:fixed;left:-10000px;top:0}

.login{max-width:360px;margin:10vh auto 0;padding:0 16px}
.err{color:#d33;font-size:13px;margin-top:8px;min-height:18px}
</style>

/* ---- แยกข้อมูลจากข้อความ ---- */
function parse(t){
  t=t.replace(/\r/g,'').replace(/(ชื่อผู้รับ|ผู้รับ|ชื่อ|เบอร์โทรศัพท์|เบอร์โทร|เบอร์|โทร|ที่อยู่|รหัสไปรษณีย์|ไปรษณีย์)\s*[:：]/g,' ');
  let phone='';
  const pm=t.match(/(?<![\d\/])\+66[-\s.]?\d[-\s.]?\d{3,4}[-\s.]?\d{4}(?!\d)/)||t.match(/(?<![\d\/])0\d{2}[-\s.]?\d{3}[-\s.]?\d{4}(?!\d)/)||t.match(/(?<![\d\/])0\d[-\s.]?\d{3}[-\s.]?\d{4}(?!\d)/);
  if(pm){phone=pm[0].replace(/\D/g,'').replace(/^66/,'0');t=t.replace(pm[0],'\n')}
  let zip='';const zs=[...t.matchAll(/(?<!\d)\d{5}(?!\d)/g)];
  if(zs.length){const z=zs[zs.length-1];zip=z[0];t=t.slice(0,z.index)+' '+t.slice(z.index+5)}
  const lines=t.split('\n').map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
  let name='',addr='';
  if(lines.length>1){name=lines[0];addr=lines.slice(1).join(' ')}
  else if(lines.length){
    const s=lines[0],m=s.search(/\s(?=\d|บ้าน|หมู่|ม\.|ซ\.|ถ\.|ต\.|อ\.|คอนโด|หอ)/);
    if(m>0){name=s.slice(0,m);addr=s.slice(m+1)}else{const w=s.split(' ');name=w.slice(0,2).join(' ');addr=w.slice(2).join(' ')}
  }
  return{name,phone,addr,zip};
}

const fit=()=>{const w=$('vPrev').clientWidth-34;if(w>0)$('stage').style.zoom=Math.min(1,w/563)};
const view=v=>{$('vIn').hidden=v!=='in';$('vPrev').hidden=v!=='prev';if(v==='prev')fit()};
function drawPrev(){cur.sender={...sender};$('stage').innerHTML=labelHTML(cur)}

/* ---- PDF ---- */
async function makePDF(items){
  await document.fonts.ready;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:[148,105],orientation:'landscape'});
  const h=$('hid');
  for(let i=0;i<items.length;i++){
    h.innerHTML=labelHTML(items[i]);
    const cv=await html2canvas(h.firstElementChild,{scale:4,backgroundColor:'#fff',useCORS:true});
    if(i)doc.addPage([148,105],'landscape');
    doc.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,148,105);
  }
  h.innerHTML='';
  return doc.output('blob');
}

/* ---- เลขที่ใบปะหน้า ---- */
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return ''+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())};
const nextNo=()=>today()+'-'+((counter.date===today()?counter.n:0)+1);
function commit(no){const m=String(no||'').match(/^(\d{8})-(\d+)$/);if(!m||m[1]!==today())return;
  const n=Math.max(counter.date===today()?counter.n:0,+m[2]);counter={date:today(),n};
  setDoc(doc(db,'settings','counter'),counter).catch(()=>{})}

/* ---- Firebase ---- */
const configured=firebaseConfig&&firebaseConfig.apiKey&&!/^วาง/.test(firebaseConfig.apiKey);
let app,auth,db,unsubs=[];
if(configured){
  app=initializeApp(firebaseConfig);auth=getAuth(app);
  db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
}else{$('lSetup').hidden=false;$('vLogin').hidden=false}
const show=v=>{$('vLogin').hidden=v!=='login';$('app').hidden=v!=='app'};
const net=()=>{const u=auth&&auth.currentUser;$('who').textContent=(navigator.onLine?'● ซิงก์อัตโนมัติ':'○ ออฟไลน์ (จะซิงก์เมื่อมีเน็ต)')+(u?' · '+u.email:'')};
addEventListener('online',net);addEventListener('offline',net);
$('lGo').onclick=async()=>{
  if(!configured)return;$('lErr').textContent='';
  try{await signInWithEmailAndPassword(auth,$('lEmail').value.trim(),$('lPass').value)}
  catch(e){$('lErr').textContent=/network/.test(e.code)?'ไม่มีอินเทอร์เน็ต':'อีเมลหรือรหัสผ่านไม่ถูกต้อง'}
};
$('lPass').onkeydown=e=>{if(e.key==='Enter')$('lGo').click()};
$('out').onclick=()=>signOut(auth);

const sm={sName:'name',sPhone:'phone',sZip:'zip',sAddr:'addr'};
function fillSender(){Object.entries(sm).forEach(([id,k])=>{const el=$(id);if(document.activeElement!==el)el.value=sender[k]||''})}
let tm;
Object.entries(sm).forEach(([id,k])=>$(id).oninput=e=>{sender[k]=e.target.value;clearTimeout(tm);tm=setTimeout(()=>setDoc(doc(db,'settings','sender'),sender).catch(()=>{}),600)});

if(configured)onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];
  if(!u){show('login');return}
  show('app');net();fillSender();
  unsubs.push(onSnapshot(doc(db,'settings','sender'),s=>{if(s.exists()){sender={...DS,...s.data()};fillSender();if(cur&&!$('vPrev').hidden)drawPrev()}}));
  unsubs.push(onSnapshot(doc(db,'settings','counter'),s=>{counter=s.exists()?s.data():{}}));
  unsubs.push(onSnapshot(query(collection(db,'labels'),orderBy('ts','desc')),s=>{saved=s.docs.map(d=>({...d.data(),id:d.id}));renderList()}));
});

/* ---- รายการที่บันทึก ---- */
const checked=()=>[...document.querySelectorAll('#list input:checked')].map(e=>e.dataset.id);
function renderList(){
  const keep=new Set(checked());
  $('cnt').textContent=saved.length?`(${saved.length})`:'';
  $('list').innerHTML=saved.length?saved.map(d=>`<div class="item"><input type="checkbox" data-id="${d.id}" ${keep.has(d.id)?'checked':''}><div class="t"><b>${d.no?esc(d.no)+' · ':''}${esc(d.name)||'(ไม่มีชื่อ)'} · ${esc(d.phone)}</b><span>${esc(d.addr)} ${esc(d.zip)}</span></div><button data-e="${d.id}">แก้ไข</button></div>`).join(''):'<p class="mu">ยังไม่มีใบปะหน้าที่บันทึกไว้</p>';
  sel();
}
function sel(){const n=checked().length;$('merge').disabled=!n;$('del').disabled=!n;$('merge').textContent=n?`บันทึก ${n} ใบเป็น PDF รวม`:'บันทึกที่เลือกเป็น PDF รวม'}
$('list').addEventListener('change',sel);
$('list').addEventListener('click',e=>{const id=e.target.dataset.e;if(!id)return;const d=saved.find(x=>x.id===id);if(!d)return;cur={...d,_id:id};fill();view('prev')});
$('all').onclick=()=>{const bs=[...document.querySelectorAll('#list input')];const on=bs.some(b=>!b.checked);bs.forEach(b=>b.checked=on);sel()};
$('del').onclick=()=>{const ids=checked();if(!confirm(`ลบ ${ids.length} ใบที่เลือก?`))return;const w=writeBatch(db);ids.forEach(i=>w.delete(doc(db,'labels',i)));w.commit().catch(()=>toast('ลบไม่สำเร็จ'))};
$('merge').onclick=()=>{const s=new Set(checked());const items=saved.filter(d=>s.has(d.id));download(items,`ใบปะหน้า-รวม-${items.length}ใบ.pdf`)};

/* ---- ดาวน์โหลด / แชร์ PDF ---- */
async function download(items,fn){
  try{
    toast('กำลังสร้าง PDF...');
    const blob=await makePDF(items);
    const file=new File([blob],fn,{type:'application/pdf'});
    if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);toast('บันทึกแล้ว');
  }catch(e){toast('สร้าง PDF ไม่สำเร็จ');console.error(e)}
}

/* ---- ปุ่มต่าง ๆ ---- */
function fill(){$('eNo').value=cur.no||'';$('eName').value=cur.name||'';$('ePhone').value=cur.phone||'';$('eAddr').value=cur.addr||'';$('eZip').value=cur.zip||'';drawPrev()}
$('gen').onclick=()=>{const t=$('raw').value.trim();if(!t){toast('กรุณาวางข้อมูลลูกค้าก่อน');return}cur=parse(t);cur.no=nextNo();fill();view('prev');scrollTo(0,0)};
$('clr').onclick=()=>{$('raw').value=''};
$('back').onclick=()=>view('in');
[['eNo','no'],['eName','name'],['ePhone','phone'],['eAddr','addr'],['eZip','zip']].forEach(([id,k])=>$(id).oninput=e=>{cur[k]=e.target.value;drawPrev()});
$('save').onclick=()=>{
  commit(cur.no);
  const id=cur._id||Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const old=saved.find(x=>x.id===id);
  const d={no:cur.no||'',name:cur.name||'',phone:cur.phone||'',addr:cur.addr||'',zip:cur.zip||'',sender:{...sender},ts:old?old.ts:Date.now()};
  setDoc(doc(db,'labels',id),d).catch(()=>toast('บันทึกไม่สำเร็จ'));
  toast('บันทึกแล้ว');$('raw').value='';view('in');
};
$('pdf1').onclick=()=>{commit(cur.no);download([cur],`ใบปะหน้า-${String(cur.no||cur.name||'label').replace(/\s+/g,'_')}.pdf`)};
</script>
